# ============================================================
#  Job Application Automation - Configuration
#  Fill in credentials for the sites you want to use.
#  Set enabled: false to skip a site.
# ============================================================

credentials:
  karriere_at:
    email: ""
    password: ""
    enabled: true
  stepstone_at:
    email: ""
    password: ""
    enabled: true
  jobs_at:
    email: ""
    password: ""
    enabled: true
  indeed:
    email: ""
    password: ""
    enabled: true
  linkedin:
    email: ""
    password: ""
    enabled: true
  willhaben:
    email: ""
    password: ""
    enabled: true
  hokify:
    email: ""
    password: ""
    enabled: true
  xing:
    email: ""
    password: ""
    enabled: true
  monster:
    email: ""
    password: ""
    enabled: false

search:
  location: "Austria"
  radius_km: 50
  job_types:
    - fulltime
    - parttime
    - remote
  salary_min: 0            # EUR/year, 0 = no minimum filter
  max_results_per_site: 20 # Max jobs to collect per site per run

application:
  max_applications_per_day: 15  # Keep low to avoid bot flags (15-20 is safe)
  delay_between_applications_seconds: 60  # 1 min between applies looks human
  min_match_score: 55      # 0-100, skip jobs below this score
  generate_cover_letter: true
  headless: false          # false = show browser window (recommended)
  take_screenshots: true
  dry_run: false           # true = search & score but don't submit

cv_path: "cv/cv.pdf"
anthropic_api_key: ""      # Get from console.anthropic.com
